{% load static %}
<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@700;800&display=swap" rel="stylesheet">
    <style>
        .navbar-brand {
            font-family: 'Poppins', sans-serif;
            font-weight: 800;
            font-size: 1.8rem;
            letter-spacing: 0.5px;
        }
        .btn {
            font-weight: 600;
        }
    </style>
    <title>
        {% block title %}
        UroKolpo        
        {% endblock %}
    </title>
</head>
<body>

<nav class="navbar navbar-expand-lg bg-body-tertiary">
  <div class="container-fluid">
    <a class="navbar-brand" href="{% url 'post_list' %}">UroKolpo</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarSupportedContent">
      <ul class="navbar-nav me-auto mb-2 mb-lg-0">
        <li class="nav-item">
          <a class="nav-link" href="{% url 'post_list' %}">Feed</a>
        </li>
        {% if user.is_authenticated %}
        <li class="nav-item">
          <a class="nav-link" href="{% url 'create_post' %}">Create Post</a>
        </li>
        {% endif %}
      </ul>
      <form class="d-flex me-3" method="get" action="{% url 'post_list' %}" role="search">
        <input class="form-control me-2" type="search" name="q" placeholder="Search posts..." aria-label="Search" value="{{ request.GET.q }}">
        <button class="btn btn-outline-light" type="submit">Search</button>
      </form>
      {% if user.is_authenticated %}
      <span class="navbar-text me-3">
        Welcome, <strong>{{ user.username }}</strong>
      </span>
      <form method="post" action="{% url 'logout' %}" class="d-inline">
        {% csrf_token %}
        <button type="submit" class="btn btn-outline-danger">Logout</button>
      </form>
      {% else %}
      <a class="btn btn-outline-primary me-2" href="{% url 'login' %}">Login</a>
      <a class="btn btn-outline-success" href="{% url 'register' %}">Register</a>
      {% endif %} 
    </div>
  </div>
</nav>


    <div class="container">
        {% block content %}
        
        {% endblock %}
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-fQnD+MPGR8rPh6gFFQh9v3DFX9hZNBDWBOlr5a9Nk8F1y8ZkVVp1O3h8yvqH1xNN" crossorigin="anonymous"></script>
</body>
</html>
